<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MARINE COLUMN MASTER</title><style>
*{box-sizing:border-box}body{margin:0;background:#eaf7ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;color:#123}main{max-width:920px;margin:auto;padding:14px}h1{color:#0878bd}.box{background:#fff;border:2px solid #9bd6f4;border-radius:16px;padding:14px;margin:11px 0}input,textarea{width:100%;padding:9px;margin:4px 0;border:1px solid #9bd6f4;border-radius:8px}textarea{min-height:65px}button{border:0;border-radius:9px;padding:9px 11px;margin:3px;background:#1686c9;color:#fff;font-weight:800}.danger{background:#b94b4b}.item{border-top:1px solid #def;padding:11px 0}.top{display:flex;gap:4px;align-items:center;flex-wrap:wrap}.top b{flex:1}.thumb{width:100px;height:72px;object-fit:contain;background:#eef9ff;border-radius:9px}.small{font-size:11px;color:#567;line-height:1.6}</style></head><body><main>
<h1>📝 MARINE COLUMN MASTER</h1><div class="small">MASTER更新：2026/09/03 21:49</div>
<div class="box"><h2>📝 コラム入口</h2><div class="small">コラム本文をこのサイトに転載するのではなく、各コラムの紹介カードを並べて外部ページへ飛ばすためのページです。タイトル・説明・画像・リンク先をMASTERから管理できます。</div></div>
<div class="box"><h2>🎨 ページ設定</h2><input id="pageTitle" value="マリン薬局コラム" placeholder="ページ題名"><input id="portal" value="https://marine-pharmacy0963.github.io/MARINE-TRICK/" placeholder="PORTAL URL"><b>ページロゴ画像</b><input id="logoFile" type="file" accept="image/*"><div id="logoPreview"></div></div>
<div class="box"><h2>📚 コラム登録</h2><div id="list"></div><button id="add">＋ コラム追加</button></div>
<div class="box"><h2>📦 書き出し</h2><button id="export">公開用 index.html を書き出す</button><div class="small">登録画像はindex.html内に埋め込みます。コラムを押すと設定したURLへ移動します。</div></div>
</main><script>
let logo="",items=[];
const E=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
logoFile.onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{logo=r.result;logoPreview.innerHTML='<img style="max-width:100%;max-height:110px" src="'+logo+'">'};r.readAsDataURL(f)};
function render(){list.innerHTML="";items.forEach((x,i)=>{let d=document.createElement("div");d.className="item";d.innerHTML=`<div class="top"><button data-up="${i}">↑</button><button data-down="${i}">↓</button><b>${E(x.title||"新しいコラム")}</b><label><input style="width:auto" type="checkbox" data-vis="${i}" ${x.visible?"checked":""}>表示</label><button class="danger" data-del="${i}">削除</button></div>${x.image?'<img class="thumb" src="'+x.image+'">':""}<input type="file" accept="image/*" data-img="${i}"><input data-i="${i}" data-k="title" value="${E(x.title)}" placeholder="コラムタイトル"><textarea data-i="${i}" data-k="desc" placeholder="短い紹介文">${E(x.desc)}</textarea><input data-i="${i}" data-k="url" value="${E(x.url)}" placeholder="リンク先URL（noteなど）"><input data-i="${i}" data-k="tag" value="${E(x.tag)}" placeholder="分類 例：お薬 / 病気 / 生活">`;list.appendChild(d)})}
list.oninput=e=>{if(e.target.dataset.i!==undefined)items[+e.target.dataset.i][e.target.dataset.k]=e.target.value};
list.onchange=e=>{if(e.target.dataset.vis!==undefined){items[+e.target.dataset.vis].visible=e.target.checked;render()}if(e.target.dataset.img!==undefined){let i=+e.target.dataset.img,f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{items[i].image=r.result;render()};r.readAsDataURL(f)}};
list.onclick=e=>{let i;if(e.target.dataset.up!==undefined){i=+e.target.dataset.up;if(i>0)[items[i-1],items[i]]=[items[i],items[i-1]];render()}if(e.target.dataset.down!==undefined){i=+e.target.dataset.down;if(i<items.length-1)[items[i+1],items[i]]=[items[i],items[i+1]];render()}if(e.target.dataset.del!==undefined){items.splice(+e.target.dataset.del,1);render()}};
add.onclick=()=>{items.push({title:"",desc:"",url:"",tag:"",image:"",visible:true});render()};
export.onclick=()=>{let data=JSON.stringify(items.filter(x=>x.visible));let title=E(pageTitle.value);let h=`<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${title}</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(#087fba,#8dddf0);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;color:#07334b}.w{max-width:950px;margin:auto;padding:16px}h1{text-align:center;color:white}.logo{display:block;max-width:min(720px,94vw);max-height:110px;object-fit:contain;margin:5px auto 14px}.grid{display:grid;grid-template-columns:1fr;gap:11px}.card{display:flex;gap:12px;align-items:center;text-decoration:none;color:inherit;background:#fffffff2;border-radius:18px;padding:11px;box-shadow:0 7px 20px #0345}.card img{width:115px;height:90px;object-fit:cover;border-radius:12px;background:#eaf8ff}.text{flex:1}.text b{display:block;font-size:16px}.tag{display:inline-block;background:#dff5ff;border-radius:999px;padding:3px 8px;font-size:10px;margin-bottom:5px}.desc{font-size:11px;color:#567;line-height:1.55}.back{display:inline-block;color:white;margin-top:16px}@media(min-width:720px){.grid{grid-template-columns:repeat(2,1fr)}}</style></head><body><div class="w"><h1>${title}</h1>${logo?'<img class="logo" src="'+logo+'">':""}<div id="grid" class="grid"></div><a class="back" href="${E(portal.value)}">← MARINE PORTALへ戻る</a></div><script>const D=${data};D.forEach(x=>{let a=document.createElement("a");a.className="card";a.href=x.url;a.target="_blank";a.rel="noopener noreferrer";a.innerHTML=(x.image?'<img src="'+x.image+'">':'')+'<div class="text">'+(x.tag?'<span class="tag">'+x.tag+'</span>':'')+'<b>'+x.title+'</b><div class="desc">'+x.desc+'</div></div>';grid.appendChild(a)});<\/script></body></html>`;let u=URL.createObjectURL(new Blob([h],{type:"text/html;charset=utf-8"})),a=document.createElement("a");a.href=u;a.download="index.html";a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};
render();</script></body></html>
